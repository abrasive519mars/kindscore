<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Kindscore mark: an outline heart hanging from the saffron full stop of "Kindscore." No tile —
       the heart flips ink/ivory with the browser's colour scheme so it reads on any tab bar. -->
  <style>
    .heart { stroke: #171411; }
    @media (prefers-color-scheme: dark) { .heart { stroke: #F7F3EC; } }
  </style>
  <path class="heart" d="M32 43 C18 33.5 12 27 12 19.5 C12 13.6 16.6 9 22.5 9 C26.5 9 30.2 11.3 32 14.8 C33.8 11.3 37.5 9 41.5 9 C47.4 9 52 13.6 52 19.5 C52 27 46 33.5 32 43Z" fill="none" stroke-width="5.5" stroke-linejoin="round"/>
  <circle cx="32" cy="50" r="7" fill="#D9791A"/>
</svg>
